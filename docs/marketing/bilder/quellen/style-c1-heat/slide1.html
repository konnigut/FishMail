<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Boldonse&family=Geist+Mono:wght@400;700&family=Inter:wght@400;500;700;800&display=block" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; }
body {
  background: linear-gradient(165deg, #FF2E63 0%, #FF6B2C 48%, #FFD23F 100%);
  color: #170410;
  font-family: 'Inter', sans-serif;
  -webkit-font-smoothing: antialiased;
}
.canvas { position: relative; width: 1080px; height: 1920px; padding: 90px 90px 80px 90px; }

.tag {
  display: inline-block;
  background: #170410; color: #FFD23F;
  font-family: 'Geist Mono', monospace;
  font-size: 26px; letter-spacing: 0.22em; text-transform: uppercase;
  padding: 18px 28px;
  transform: rotate(-2deg);
}
.page {
  position: absolute; top: 98px; right: 90px;
  font-family: 'Geist Mono', monospace;
  font-size: 26px; letter-spacing: 0.18em;
  color: rgba(23, 4, 16, 0.75);
}

.stage { margin-top: 140px; }
h1 {
  font-family: 'Boldonse', sans-serif;
  font-weight: 400;
  font-size: 116px;
  line-height: 1.34;
  text-transform: uppercase;
  letter-spacing: 0.01em;
}
h1 .flip {
  display: inline-block;
  background: #170410; color: #FF2E63;
  padding: 4px 26px 14px 26px;
  transform: rotate(-1.5deg);
}

.sub {
  margin-top: 76px;
  font-size: 40px; line-height: 1.5; font-weight: 500;
  max-width: 820px;
  color: rgba(23, 4, 16, 0.9);
}
.sub strong { font-weight: 800; }

.sticker {
  position: absolute;
  left: 90px; bottom: 300px;
  background: #FFFFFF;
  border: 5px solid #170410;
  box-shadow: 14px 14px 0 #170410;
  transform: rotate(2deg);
  padding: 36px 44px;
}
.sticker .s1 {
  font-family: 'Geist Mono', monospace;
  font-size: 25px; letter-spacing: 0.2em; text-transform: uppercase;
  color: #FF2E63; font-weight: 700;
  margin-bottom: 12px;
}
.sticker .s2 {
  font-family: 'Boldonse', sans-serif;
  font-size: 52px; text-transform: uppercase; line-height: 1.42;
}

.footer {
  position: absolute; left: 90px; right: 90px; bottom: 80px;
  border-top: 5px solid #170410;
  padding-top: 26px;
  display: flex; justify-content: space-between;
  font-family: 'Geist Mono', monospace;
  font-size: 25px; letter-spacing: 0.14em; text-transform: uppercase;
  font-weight: 700;
  white-space: nowrap;
}
</style>
</head>
<body>
  <div class="canvas">
    <span class="tag">Ich vermittle gerade einen Job</span>
    <span class="page">1/3</span>

    <main class="stage">
      <h1>Dein 12-&euro;-<br>Nebenjob<br>kann <span class="flip">weg.</span></h1>
      <p class="sub">Sales-Job, <strong>100&nbsp;% remote</strong> &mdash; passt neben Uni und Hauptjob. Bezahlt wird nach <strong>Leistung</strong>, nicht nach Stunden.</p>
    </main>

    <div class="sticker">
      <p class="s1">Unsere Closer machen</p>
      <p class="s2">&Oslash; 2&ndash;5 Deals<br>im Monat &rarr;</p>
    </div>

    <footer class="footer">
      <span>Weiter</span>
      <span>&rarr; ob du passt</span>
    </footer>
  </div>
</body>
</html>
