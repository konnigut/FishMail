<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; }
body {
  background: #FFDE00;
  background-image: radial-gradient(rgba(16, 16, 16, 0.09) 2.4px, transparent 2.4px);
  background-size: 26px 26px;
  color: #101010;
  font-family: 'Work Sans', sans-serif;
  -webkit-font-smoothing: antialiased;
}
.canvas { position: relative; width: 1080px; height: 1920px; padding: 84px 90px 80px 90px; }

.frame {
  position: absolute; inset: 40px;
  border: 6px solid #101010;
  pointer-events: none;
}

.head {
  display: flex; justify-content: space-between; align-items: center;
}
.head .tag {
  background: #2B44FF; color: #FFDE00;
  font-size: 26px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  padding: 16px 26px;
  transform: rotate(-1.5deg);
  box-shadow: 8px 8px 0 #101010;
}
.head .page {
  font-size: 28px; font-weight: 700;
}

.stage { margin-top: 150px; }
h1 {
  font-family: 'Erica One', sans-serif;
  font-weight: 400;
  font-size: 158px;
  line-height: 0.98;
  text-transform: uppercase;
  letter-spacing: 0.005em;
}
h1 .red { color: #FF3A2F; -webkit-text-stroke: 3px #101010; }

.sub {
  margin-top: 70px;
  font-size: 40px; line-height: 1.5; font-weight: 500;
  max-width: 830px;
}
.sub strong { font-weight: 800; background: #FFFFFF; padding: 0 10px; box-shadow: 6px 6px 0 #101010; }

.stamp {
  position: absolute;
  right: 96px; bottom: 320px;
  border: 6px solid #FF3A2F;
  color: #FF3A2F;
  font-family: 'Erica One', sans-serif;
  font-size: 46px;
  text-transform: uppercase;
  text-align: center;
  line-height: 1.15;
  padding: 26px 34px;
  transform: rotate(7deg);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.65);
}

.footer {
  position: absolute; left: 90px; right: 90px; bottom: 84px;
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 27px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.1em;
  white-space: nowrap;
}
.footer .r { background: #101010; color: #FFDE00; padding: 10px 18px; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="frame"></div>
    <header class="head">
      <span class="tag">Ich vermittle einen Job</span>
      <span class="page">1/3</span>
    </header>

    <main class="stage">
      <h1>Mehr Geld.<br><span class="red">Weniger</span><br>Bla&nbsp;Bla.</h1>
      <p class="sub">Sales-Job, <strong>100&nbsp;% remote</strong>, passt neben Uni und Hauptjob. Kein Repost von irgendwem &mdash; <strong>ich kenne die Leute</strong> dahinter.</p>
    </main>

    <div class="stamp">&Oslash; 2&ndash;5 Deals<br>im Monat</div>

    <footer class="footer">
      <span>Weiter &rarr;</span>
      <span class="r">Ob du passt</span>
    </footer>
  </div>
</body>
</html>
